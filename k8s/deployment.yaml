apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-tasks-app
  namespace: default
  labels:
    app: brain-tasks-app
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: brain-tasks-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: brain-tasks-app
        version: "1.0"
    spec:
      containers:
        - name: brain-tasks-app
          # Replace <AWS_ACCOUNT_ID> and <AWS_REGION> with your actual values
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/brain-tasks-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
